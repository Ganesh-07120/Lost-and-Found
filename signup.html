<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up | Lost & Found</title><link rel="stylesheet" href="style.css"></head>
<body class="login-page"><main class="login-wrap"><section class="login-card"><div class="login-logo">L<span>&</span>F</div><span class="eyebrow">JOIN THE COMMUNITY</span><h1>Create account.</h1><p>Make an account to report and track items.</p>
<form id="signupForm"><label for="signupFullName">Full name</label><input id="signupFullName" autocomplete="name" maxlength="80" placeholder="Enter your full name" required><label for="signupStudentId">Student / Roll number</label><input id="signupStudentId" autocomplete="off" maxlength="40" placeholder="Enter your student or roll number" required><label for="signupEmail">College email</label><input id="signupEmail" type="email" autocomplete="email" maxlength="120" placeholder="you@example.com" required><label for="signupCourse">Course and year</label><input id="signupCourse" maxlength="80" placeholder="e.g. TY BScIT" required><label for="signupDepartment">Department / College</label><input id="signupDepartment" maxlength="120" placeholder="Enter department or college name" required><label for="signupPhone">Contact number (optional)</label><input id="signupPhone" type="tel" autocomplete="tel" maxlength="20" placeholder="Enter contact number"><label for="signupUsername">Username</label><input id="signupUsername" autocomplete="username" minlength="3" maxlength="30" placeholder="Choose a username" required><label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="4" placeholder="At least 4 characters" required><label for="signupConfirm">Confirm password</label><input id="signupConfirm" type="password" autocomplete="new-password" minlength="4" placeholder="Re-enter password" required><p id="signupMessage" class="login-error" role="alert"></p><button class="primary-btn" type="submit">Create account <span>↗</span></button></form>
<p class="demo-hint">Already registered? <a href="login.html">Login here</a></p><p class="demo-hint">Student registration demo: details are stored only in this browser. Do not enter sensitive personal information.</p></section><p class="login-footer">LOST & FOUND MANAGEMENT SYSTEM · CREATED BY GANESH DUBEY</p></main><script src="script.js"></script></body></html>
